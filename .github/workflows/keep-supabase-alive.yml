# Menjaga project Supabase (paket gratis) supaya tidak di-pause karena tidak ada aktivitas.
# Berjalan otomatis tiap 3 hari, dan bisa dijalankan manual dari tab "Actions" di GitHub.
#
# Perlu 2 secret di GitHub: Settings > Secrets and variables > Actions > New repository secret
#   SUPABASE_URL       -> https://xxxxx.supabase.co
#   SUPABASE_ANON_KEY  -> sb_publishable_... (key yang sama dengan di config.js)

name: Keep Supabase awake

on:
  schedule:
    - cron: '0 3 */3 * *' # tiap 3 hari, jam 03:00 UTC (10:00 WIB)
  workflow_dispatch: # tombol "Run workflow" untuk tes manual

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # membaca daftar file bucket foto (hanya membaca, tidak mengubah apa pun)
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "$SUPABASE_URL/storage/v1/object/list/photo-assets" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"prefix":"","limit":1}')
          echo "Supabase menjawab HTTP $code"
          test "$code" = "200"
